# Deployed by Dokploy on the home server. FRAME_LAN_HOST and FRAME_TAILNET_HOST come from the
# Dokploy app's environment, so no hostnames are committed here.
services:
  frame:
    build: .
    container_name: frame
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # The photo frame loads this over plain HTTP on the LAN.
      - "traefik.http.routers.frame.rule=Host(`${FRAME_LAN_HOST}`) && PathPrefix(`/frame`)"
      - "traefik.http.routers.frame.entrypoints=web"
      - "traefik.http.routers.frame.middlewares=frame-strip"
      - "traefik.http.routers.frame.service=frame"
      - "traefik.http.routers.frame-secure.rule=Host(`${FRAME_TAILNET_HOST}`) && PathPrefix(`/frame`)"
      - "traefik.http.routers.frame-secure.entrypoints=websecure"
      - "traefik.http.routers.frame-secure.tls=true"
      - "traefik.http.routers.frame-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.frame-secure.tls.domains[0].main=${FRAME_TAILNET_HOST}"
      - "traefik.http.routers.frame-secure.middlewares=frame-strip"
      - "traefik.http.routers.frame-secure.service=frame"
      - "traefik.http.middlewares.frame-strip.stripprefix.prefixes=/frame"
      - "traefik.http.services.frame.loadbalancer.server.port=80"

  api:
    build: ./server
    container_name: frame-api
    restart: unless-stopped
    environment:
      # BOM geohash for the weather location. Required: set BOM_LOCATION in the Dokploy app environment.
      - BOM_LOCATION=${BOM_LOCATION:?set BOM_LOCATION}
      # Home Assistant (optional). Without HA_URL and HA_TOKEN the frame keeps its mock home screen.
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      - HA_HIDE=${HA_HIDE:-}
      # Solar/battery: shared entity prefix of the inverter sensors, plus the battery's size and reserve.
      - HA_BATTERY_PREFIX=${HA_BATTERY_PREFIX:-}
      - HA_BATTERY_KWH=${HA_BATTERY_KWH:-}
      - HA_BATTERY_RESERVE=${HA_BATTERY_RESERVE:-}
      # Shared Google Calendar's secret iCal address (optional). Without it the frame keeps its mock events.
      - GCAL_ICS_URL=${GCAL_ICS_URL:-}
      # Trello board for the grocery list (optional, all three needed). Without them the frame keeps its mock groceries.
      - TRELLO_API_KEY=${TRELLO_API_KEY:-}
      - TRELLO_TOKEN=${TRELLO_TOKEN:-}
      - TRELLO_BOARD=${TRELLO_BOARD:-}
      # Comma-separated first names to leave out of the chore assignees (optional).
      - CHORES_HIDE_MEMBERS=${CHORES_HIDE_MEMBERS:-}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Same hosts as the dashboard, longer path, so these win over the /frame router.
      - "traefik.http.routers.frame-api.rule=Host(`${FRAME_LAN_HOST}`) && PathPrefix(`/frame/api`)"
      - "traefik.http.routers.frame-api.entrypoints=web"
      - "traefik.http.routers.frame-api.priority=100"
      - "traefik.http.routers.frame-api.middlewares=frame-strip"
      - "traefik.http.routers.frame-api.service=frame-api"
      - "traefik.http.routers.frame-api-secure.rule=Host(`${FRAME_TAILNET_HOST}`) && PathPrefix(`/frame/api`)"
      - "traefik.http.routers.frame-api-secure.entrypoints=websecure"
      - "traefik.http.routers.frame-api-secure.tls=true"
      - "traefik.http.routers.frame-api-secure.tls.certresolver=tailscale"
      - "traefik.http.routers.frame-api-secure.priority=100"
      - "traefik.http.routers.frame-api-secure.middlewares=frame-strip"
      - "traefik.http.routers.frame-api-secure.service=frame-api"
      - "traefik.http.services.frame-api.loadbalancer.server.port=8080"

networks:
  dokploy-network:
    external: true
